<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Dark Navy Background -->
  <rect width="64" height="64" rx="14" fill="#0D1B2A" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Subtle Chakra / Radar Rays -->
  <g opacity="0.3" stroke="#00E5FF" stroke-width="0.8">
    <circle cx="32" cy="32" r="22" stroke-dasharray="2 3" />
    <circle cx="32" cy="32" r="14" />
    <line x1="32" y1="10" x2="32" y2="54" />
    <line x1="10" y1="32" x2="54" y2="32" />
  </g>

  <!-- Security Shield Emblem -->
  <path d="M 32 14 L 47 19 C 47 33 39 43 32 47 C 25 43 17 33 17 19 Z" fill="#1E5AA8" stroke="#00E5FF" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Saffron Truck Emblem -->
  <g fill="#FF9933">
    <!-- Truck Cargo Body -->
    <rect x="23" y="24" width="10" height="9" rx="1" />
    <!-- Truck Cabin -->
    <path d="M 33 27 H 37 L 39 30 V 33 H 33 Z" />
    <!-- Cab Window -->
    <rect x="34" y="28" width="3" height="2" fill="#0D1B2A" />
  </g>
  <!-- Wheels -->
  <circle cx="26" cy="34" r="2" fill="#0D1B2A" stroke="#FFFFFF" stroke-width="1.2" />
  <circle cx="36" cy="34" r="2" fill="#0D1B2A" stroke="#FFFFFF" stroke-width="1.2" />
  
  <!-- Tricolor Accent Strip -->
  <rect x="23" y="52" width="6" height="2.5" rx="1" fill="#FF9933" />
  <rect x="29" y="52" width="6" height="2.5" rx="1" fill="#FFFFFF" />
  <rect x="35" y="52" width="6" height="2.5" rx="1" fill="#138808" />
</svg>
